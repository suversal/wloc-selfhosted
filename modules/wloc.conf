#!name=Apple WLOC 定位修改
#!desc=修改 Apple 网络定位返回坐标 | 自托管选点页面: https://wloc-selfhosted.suyang219.workers.dev/
#!author=Yu9191 Rewrite
#!homepage=https://github.com/suversal/wloc-selfhosted

[rewrite_local]
^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc url script-response-body https://raw.githubusercontent.com/suversal/wloc-selfhosted/refs/heads/main/dist/wloc.js
^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save url script-echo-response https://raw.githubusercontent.com/suversal/wloc-selfhosted/refs/heads/main/dist/wloc-settings.js

[mitm]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
